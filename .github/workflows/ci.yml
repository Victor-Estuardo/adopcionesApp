name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall ejecuta `prisma generate`
      - run: npm ci

      - name: Verificación de tipos
        run: npm run typecheck

      - name: Compilación
        run: npm run build
